[project]
name = "ambulance-route-clearance"
version = "1.0.0"
description = "OpenEnv environment for ambulance route clearance via AI traffic signal control"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.27.1",
    "pydantic==2.6.1",
    "openenv-core==0.2.3",
    "requests",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
